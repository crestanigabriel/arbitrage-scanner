name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Conventional Commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no previous commit, and after a force push the old one may be gone,
          # so in those cases the whole history is checked.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            make check-commits RANGE="$BASE..$HEAD"
          else
            make check-commits RANGE="$HEAD"
          fi

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      compose: ${{ steps.filter.outputs.compose }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - 'services/ingestor/**'
              - 'fixtures/contracts/**'
              - 'deploy/ingestor.env' # read by a config test
              - 'Makefile'
              - '.github/workflows/ci.yml'
            python:
              - 'services/detector/**'
              - 'fixtures/contracts/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            compose:
              - 'deploy/**'
              - 'services/ingestor/**' # the image compose builds
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'services/ingestor/go.mod'
              - 'services/ingestor/internal/gen/**'
              - 'services/detector/src/arbscanner/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  proto:
    name: Protobuf (schema and codegen)
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `buf breaking` reads the base commit from git
      # protoc-gen-go runs as a `go tool` of the ingestor module.
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/ingestor/go.mod
          cache-dependency-path: services/ingestor/go.sum
      - name: Lint
        run: make lint-proto
      - name: Breaking changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # Skipped by the target when BASE has no schema (a new branch, a force push, or the first
        # commit that adds buf.yaml).
        run: make breaking BREAKING_REF="$BASE"
      - name: Generated code is up to date
        run: |
          make gen
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::generated code is out of date: run 'make gen' and commit the result"
            exit 1
          fi

  go:
    name: Go (ingestor)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/ingestor/go.mod
          cache-dependency-path: services/ingestor/go.sum
      - name: Lint
        run: make lint-go
      - name: Test
        run: make test-go

  python:
    name: Python (detector)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          working-directory: services/detector
          enable-cache: true
      - name: Install dependencies
        working-directory: services/detector
        run: uv sync --locked
      - name: Lint
        run: make lint-py
      - name: Test
        run: make test-py

  compose:
    name: Compose config
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build the images
        run: docker compose -f deploy/docker-compose.yml build
