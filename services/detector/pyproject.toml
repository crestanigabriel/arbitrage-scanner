[project]
name = "detector"
version = "0.1.0"
description = "Cross-exchange arbitrage detector consuming order books and trades from NATS."
requires-python = ">=3.13"
dependencies = [
  # Same minor as the protoc that generates src/arbscanner (PROTOC_VERSION in the Makefile).
  "protobuf>=7.36.2,<8",
]

[project.scripts]
detector = "detector.main:main"

[dependency-groups]
dev = [
  "hypothesis>=6.170.17",
  "pytest>=9.2",
  "ruff>=0.17.6",
  "ty>=0.0.108",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

# --- ruff: linting + formatting -------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# Protobuf code generated by `make gen`; never edited by hand.
extend-exclude = ["src/arbscanner"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "B",     # flake8-bugbear
  "UP",    # pyupgrade
  "SIM",   # flake8-simplify
  "N",     # pep8-naming
  "RUF",   # ruff-specific
  "PT",    # flake8-pytest-style
  "ASYNC", # flake8-async
  "S",     # flake8-bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works

[tool.ruff.lint.isort]
known-first-party = ["detector", "arbscanner"]

# --- ty: type checking ----------------------------------------------------------
[tool.ty.environment]
python-version = "3.13"

# Generated code is not checked itself; its .pyi stubs still type the code that imports it.
[tool.ty.src]
exclude = ["src/arbscanner"]

[tool.ty.terminal]
error-on-warning = true

# --- pytest ---------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared test helpers (fakes, builders, hypothesis strategies) are imported from tests/.
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "integration: needs real infrastructure (containers, network)",
]
