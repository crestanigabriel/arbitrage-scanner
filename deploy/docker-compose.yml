name: arbitrage-scanner

services:
  nats:
    image: nats:2.15.3-alpine
    # -js: enable JetStream, -sd: JetStream storage dir, -m: monitoring port
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222" # client connections
      - "8222:8222" # HTTP monitoring (/healthz, /jsz, /varz)
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  ingestor:
    build: ../services/ingestor
    image: arbscanner-ingestor:dev
    env_file: ingestor.env
    environment:
      NATS_URL: nats://nats:4222 # the compose service, not localhost
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "8080:8080" # /metrics and /healthz
    # The image's HEALTHCHECK runs `/ingestor healthcheck`. It is repeated here so that
    # `make up --wait` uses the same timings.
    healthcheck:
      test: ["CMD", "/ingestor", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  nats-data:
